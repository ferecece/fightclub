services:
  server:
    image: ghcr.io/ferecece/the-last-ballad:latest
    build:
      context: ./docker
      dockerfile: Dockerfile
    tty: true
    stdin_open: true
    environment:
      SERVER_NAME: ${SERVER_NAME:-THE LAST BALLAD}
      SERVER_PORT: ${SERVER_PORT:-22000}
      HTTP_PORT: ${HTTP_PORT:-22000}
      HTTP_SERVER: ${HTTP_SERVER:-true}
      HTTP_URL: ${HTTP_URL:-}
      MAX_PLAYERS: ${MAX_PLAYERS:-32}
      GAME: ${GAME:-gta:iv}
      GAMEMODE: ${GAMEMODE:-Racing}
      IV_EPISODE: ${IV_EPISODE:-2}
      IV_GAMEMODE: ${IV_GAMEMODE:-16}
      IV_NATIVE_MULTIPLAYER: ${IV_NATIVE_MULTIPLAYER:-true}
      SERVER_BROWSER: ${SERVER_BROWSER:-true}
      SERVER_QUERY: ${SERVER_QUERY:-true}
      SERVER_PASSWORD: ${SERVER_PASSWORD:-}
      GTAC_UPDATE_ON_START: ${GTAC_UPDATE_ON_START:-false}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    ports:
      - "${SERVER_PORT:-22000}:${SERVER_PORT:-22000}/udp"
      - "${HTTP_PORT:-22000}:${HTTP_PORT:-22000}/tcp"
    volumes:
      - ./server:/home/container
    user: "${PUID:-1000}:${PGID:-1000}"
    stop_grace_period: 30s
    restart: unless-stopped
