name: server-template

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build template archive
        run: |
          tar -czf server-template.tar.gz -C server .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: server-template.tar.gz
          generate_release_notes: true
